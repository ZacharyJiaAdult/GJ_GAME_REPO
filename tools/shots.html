<!doctype html>
<meta charset="utf-8">
<title>Quiltopia screenshots</title>
<style>body{margin:0;display:flex;gap:10px;padding:8px;background:#777}iframe{border:0;background:#fff;flex:none}</style>
<div id="frames"></div>
<script>
  // Phone-sized frames (390x844), each driven to a different moment of real play. ?set=1..14 picks which:
  // 1-4 the first visit, 5 onward after it (see the notes on each set). Run with tools/shots.ps1, which saves PNGs.
  // Clears this browser's demo world.
  const base = new URL('../index.html?demo&sim=off&player=', location.href).href;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  async function until(fn, ms) { const end = Date.now() + (ms || 8000); while (Date.now() < end) { try { const v = fn(); if (v) return v; } catch (e) {} await wait(50); } return null; }
  function tap(win, x, y) {
    const s = win.Q.toScreen(x, y), c = win.document.getElementById('world');
    const o = { clientX: s.x, clientY: s.y, pointerId: 1, pointerType: 'touch', bubbles: true, isPrimary: true };
    c.dispatchEvent(new win.PointerEvent('pointerdown', o)); c.dispatchEvent(new win.PointerEvent('pointerup', o));
  }
  function frame(slot, prefs) {
    const f = document.createElement('iframe');
    f.width = 390; f.height = 844;
    document.getElementById('frames').appendChild(f);
    localStorage.setItem('quiltopia:prefs:' + slot, JSON.stringify(prefs || { night: 'day' }));
    return new Promise((res) => { f.addEventListener('load', async () => { await until(() => f.contentWindow.Q && f.contentWindow.Q.me); res(f.contentWindow); }, { once: true }); f.src = base + slot; });
  }
  const coachHas = (w, re) => re.test(w.document.getElementById('coach').textContent) && !w.document.getElementById('coach').hidden;
  const sheetHas = (w, re) => re.test(w.document.getElementById('sheet').textContent);
  const click = (w, sel) => w.document.querySelector(sel).click();

  async function tapHouse(w) {
    await until(() => coachHas(w, /glowing house/));
    const h = w.Q.kitSpots()[0];
    tap(w, h.x + 0.5, h.y + 0.5);
    await until(() => coachHas(w, /moved in/));
    return h;
  }
  async function meet(w, h) {
    const a = await until(() => w.Q.renderer.residentsOf(h.x, h.y)[0]);
    tap(w, a.x, a.y - 0.15);
    await until(() => Object.keys(w.Q.me.stitchbook || {}).length);
  }
  async function finishKit(w, noSheet) {
    const h = await tapHouse(w);
    await meet(w, h);
    for (let k = 0; k < 4; k++) {
      const s = await until(() => w.Q.kitSpots() && w.Q.kitSpots()[0]);
      if (!s) break;
      await wait(900);
      tap(w, s.x + 0.5, s.y + 0.5);
      await until(() => w.Q.R.patchAt(w.Q.world, s.x, s.y));
    }
    if (!noSheet) await until(() => sheetHas(w, /Home sweet home/), 6000);
  }
  async function toWonderHook(w) {
    await finishKit(w);
    click(w, '[data-act="ob-name"]');
    await until(() => w.document.querySelector('#name-choices'));
    click(w, '[data-act="save-name"]');
    await until(() => sheetHas(w, /almost done/));
  }
  async function onboard(w) {
    await toWonderHook(w);
    click(w, '[data-act="ob-skip"]');
    await until(() => w.document.querySelector('#nation-list'));
    click(w, '#nation-list [data-code="JP"]');
    await until(() => coachHas(w, /daily rewards/));
    click(w, '#coach-btn');
    await until(() => sheetHas(w, /Daily reward/));
    w.Q.closeSheet(true);
    await wait(300);
  }

  // Stops time in a frame: no more animation frames or timers, so the canvas keeps its last picture.
  // t: the moment to draw (default now).
  const freeze = (w, t) => {
    // Headless Edge starves animation frames, so draw this moment by hand first (a few small steps, so sparks move).
    const t0 = t || w.performance.now() / 1000;
    for (let i = 0; i < 3; i++) w.Q.renderer.frame(w.Q.scene(), w.Q.cam, t0 + i * 0.05, 0.05);
    w.Q.frameOverride = () => {}; // an animation frame already queued must not repaint over it
    // Nor may it take in a world another frame saves later (a new one reloads the page), or save its own over it.
    if (w.Q.server) { w.Q.server.pull = () => {}; w.Q.server.write = () => {}; }
    w.requestAnimationFrame = () => 0; w.setTimeout = () => 0; w.setInterval = () => 0;
    for (const k of ["openSheet", "coach", "coachHide", "flyTo", "card", "hideCard", "toast", "showBanner"]) w.Q[k] = () => {};
    // Timers already running inside the app would hide these: keep them as they are now.
    // CSS animations stop too: entrances at their end, a goal card at its fully shown middle.
    for (const an of w.document.getAnimations()) { if (an.animationName === 'goal-rise') an.currentTime = 900; else try { an.finish(); } catch (e) { /* endless */ } an.pause(); }
    for (const id of ["card", "coach", "basting", "banner", "goal-card"]) { const el = w.document.getElementById(id), was = el.hidden; new w.MutationObserver(() => { if (el.hidden !== was) el.hidden = was; }).observe(el, { attributes: true }); }
  };
  // Runs the world's little lives forward by hand (headless Edge barely draws animation frames).
  function simulate(w, seconds, from) {
    const t0 = from || w.performance.now() / 1000;
    for (let i = 0; i < seconds * 20; i++) w.Q.renderer.frame(w.Q.scene(), w.Q.cam, t0 + i * 0.05, 0.05);
  }
  // Plays through the first visit, then jumps to a level.
  async function levelUp(w, level) {
    await onboard(w);
    const s = w.Q.server, r = s.meRow();
    r.xp = w.Q.R.levelFloor(level);
    r.buttons = 300;
    s.write();
    await w.Q.refreshMe();
  }

  // Plays through, then comes back nine hours later to a few things the neighbors did.
  async function comeBack(w, night) {
    await onboard(w);
    const Q = w.Q, s = Q.server, me = s.meRow(), R = Q.R, ago = (h) => Date.now() - h * 3600e3;
    const neighbors = s.data.players.filter((p) => p.demo);
    for (const [i, h] of [[3, 2], [7, 5]]) s.data.stickers.push({ id: s.data.nextId++, from: neighbors[i].id, target: 'home:' + me.id, kind: 'heart', at: ago(h), day: R.dayOf(ago(h)) });
    const garden = s.data.patches.find((p) => p.owner === me.id && p.kind === 'garden');
    if (garden) s.data.waterings.push({ garden: garden.id, helper: neighbors[9].id, period: R.periodOf(ago(3), s.periodMs), at: ago(3) });
    const tree = s.data.wonders[0];
    let n = 0;
    for (const sl of R.slotsOf(tree.blueprint)) {
      if (n >= 9) break;
      const x = tree.x + sl.dx, y = tree.y + sl.dy;
      if (R.patchAt(s.world, x, y)) continue;
      s.insert(x, y, sl.kind, neighbors[n % 20].id, R.zoneOf(s.world, x, y), { at: ago(4) });
      n++;
    }
    me.calendar.last = R.dayOf(Date.now()) - 1;
    s.write();
    const prefs = JSON.parse(w.localStorage.getItem(`quiltopia:prefs:${new URL(w.location.href).searchParams.get('player')}`));
    prefs.lastSeen = ago(9);
    if (night) prefs.night = 'night';
    w.localStorage.setItem(`quiltopia:prefs:${new URL(w.location.href).searchParams.get('player')}`, JSON.stringify(prefs));
    w.location.reload();
    await wait(800);
    await until(() => w.Q && w.Q.me && /Welcome back/.test(w.document.getElementById('sheet').textContent), 10000);
    await wait(600);
  }
  async function moveIn(w) { const h = await tapHouse(w); await wait(1000); return h; }

  // A first visit up to the Wonder invitation, where neighbors have stitched all but one slot, which the
  // newcomer fills.
  async function firstSlotFinishes(w) {
    await toWonderHook(w);
    const Q = w.Q, s = Q.server, R = Q.R;
    const won = s.data.wonders.find((x) => x.status === 'open' && !x.completedAt);
    const neighbors = s.data.players.filter((p) => p.demo);
    const open = R.slotsOf(won.blueprint).map((sl) => ({ x: won.x + sl.dx, y: won.y + sl.dy, kind: sl.kind })).filter((c) => !R.patchAt(s.world, c.x, c.y));
    const last = open.filter((c) => R.available(Q.effectiveMe(), c.kind) > 0).pop();
    let n = 0;
    for (const c of open) if (c !== last) s.insert(c.x, c.y, c.kind, neighbors[n++ % 14].id, R.zoneOf(s.world, c.x, c.y), { at: Date.now() - 3600e3 });
    s.write();
    click(w, '[data-act="ob-wonder"]');
    await until(() => Q.preview && Q.preview.ok);
    await wait(1400);
    click(w, '#btn-confirm');
    await until(() => Q.world.wonders.find((x) => x.id === won.id).completedAt, 16000);
  }

  // Plays through, then neighbors open and finish every Wonder, so the town proposes the next one.
  async function finishAll(w) {
    await onboard(w);
    const Q = w.Q, s = Q.server, R = Q.R;
    const neighbors = s.data.players.filter((p) => p.demo);
    for (const won of s.data.wonders.filter((x) => x.status === 'founding')) for (const p of neighbors) if (won.status === 'founding' && !won.founders.includes(p.id)) s.addFounder(won, p.id);
    let n = 0;
    for (const won of s.data.wonders.filter((x) => !x.completedAt)) {
      for (const sl of R.slotsOf(won.blueprint)) {
        const x = won.x + sl.dx, y = won.y + sl.dy;
        if (!R.patchAt(s.world, x, y)) s.insert(x, y, sl.kind, neighbors[n++ % 14].id, R.zoneOf(s.world, x, y), { at: Date.now() - 3600e3 });
      }
    }
    s.write();
    await until(() => Q.world.wonders.some((x) => x.status === 'founding' && !x.foundedBy), 8000);
    // Let the show run to its plaque, then close it (and any level-up that waited for it).
    await until(() => sheetHas(w, /Stitched by/), 25000);
    Q.closeSheet(true);
    await wait(600);
    Q.closeSheet(true);
    Q.hideBanner();
  }

  // Finishes one of today's goals the quick way (straight into the demo's records), then lets the game
  // notice and pay it out.
  function finishGoal(w, id) {
    const Q = w.Q, s = Q.server, R = Q.R, me = s.meRow(), now = Date.now();
    const other = s.data.players.find((p) => p.demo);
    const home = R.homeRect(s.world, me);
    const free = [];
    for (let y = home.y; y < home.y + home.h; y++) for (let x = home.x; x < home.x + home.w; x++) if (!R.patchAt(s.world, x, y)) free.push({ x, y });
    const put = (extra) => { const c = free.shift(); s.insert(c.x, c.y, 'tree', me.id, R.zoneOf(s.world, c.x, c.y), extra); };
    for (let i = 0; i < R.GOALS[id].target; i++) {
      if (id === 'sticker1') s.data.stickers.push({ id: s.data.nextId++, from: me.id, target: 'home:' + other.id, kind: 'heart', at: now, day: R.dayOf(now) });
      else if (id === 'water2') s.data.waterings.push({ garden: -1 - i, helper: me.id, period: R.periodOf(now, s.periodMs), at: now });
      else if (id === 'meet1') s.data.meets.push({ player: me.id, species: 'buttonling', at: now });
      else if (id === 'visit1') s.data.visits.push({ player: me.id, block: 99, at: now });
      else if (id === 'gift1') s.data.gifts.push({ from: me.id, to: other.id, kind: 'tree', at: now });
      else if (id === 'beside1') put({ beside: true });
      else if (id === 'wonder1') {
        const won = s.data.wonders.find((x) => x.status === 'open' && !x.completedAt);
        const sl = R.slotsOf(won.blueprint).map((q) => ({ x: won.x + q.dx, y: won.y + q.dy, kind: q.kind })).find((q) => !R.patchAt(s.world, q.x, q.y));
        s.insert(sl.x, sl.y, sl.kind, me.id, R.zoneOf(s.world, sl.x, sl.y));
      } else put();
    }
    s.write();
    Q.claimGoalsSoon();
  }
  const todaysGoals = async (w) => (await w.Q.server.goals()).list;

  // Notes when a Wonder show starts and when its Stitchling steps out (in renderer seconds).
  function watchShow(w) {
    const at = {};
    w.Q.on('show-start', () => { at.start = w.performance.now() / 1000; });
    w.Q.on('show-debut', () => { at.debut = w.performance.now() / 1000; });
    return at;
  }

  // Plays through, then neighbors fill the Wonder going up but for one slot, and you stitch the last one.
  async function finishWonder(w) {
    await onboard(w);
    const Q = w.Q, s = Q.server, R = Q.R, me = s.meRow();
    const won = s.data.wonders.find((x) => x.status === 'open' && !x.completedAt);
    const neighbors = s.data.players.filter((p) => p.demo);
    const open = R.slotsOf(won.blueprint).map((sl) => ({ x: won.x + sl.dx, y: won.y + sl.dy, kind: sl.kind })).filter((c) => !R.patchAt(s.world, c.x, c.y));
    const last = open.filter((c) => R.PATCHES[c.kind].group === 'basic').pop();
    let n = 0;
    for (const c of open) if (c !== last) s.insert(c.x, c.y, c.kind, neighbors[n++ % 14].id, R.zoneOf(s.world, c.x, c.y), { at: Date.now() - 3600e3 });
    me.picks = Math.max(me.picks, 3);
    s.write();
    await Q.refreshMe();
    Q.helpBuild(Q.world.wonders.find((x) => x.id === won.id));
    await until(() => Q.preview && Q.preview.ok);
    await wait(1400);
    click(w, '#btn-confirm');
    await until(() => Q.world.wonders.find((x) => x.id === won.id).completedAt, 16000);
    return Q.world.wonders.find((x) => x.id === won.id);
  }

  const sets = {
    // The first minute.
    1: [
      async (w) => { await until(() => coachHas(w, /Welcome/)); w.Q.flyTo = () => {}; },
      async (w) => { await until(() => coachHas(w, /glowing house/)); },
      async (w) => { await moveIn(w); },
    ],
    2: [
      async (w) => { const h = await moveIn(w); await meet(w, h); await wait(450); freeze(w); },
      async (w) => { const h = await moveIn(w); await meet(w, h); const g = await until(() => coachHas(w, /garden/) && w.Q.kitSpots()[0]); await wait(800); tap(w, g.x + 0.5, g.y + 0.5); await wait(380); freeze(w); },
      async (w) => { await finishKit(w, true); await wait(900); freeze(w); },
    ],
    3: [
      async (w) => { await finishKit(w); },
      async (w) => { await toWonderHook(w); },
      async (w) => { await toWonderHook(w); click(w, '[data-act="ob-wonder"]'); await until(() => coachHas(w, /Stitch it here/), 6000); },
    ],
    4: [
      async (w) => { await toWonderHook(w); click(w, '[data-act="ob-wonder"]'); await until(() => w.Q.preview && w.Q.preview.ok); await wait(1400); click(w, '#btn-confirm'); await until(() => coachHas(w, /Basting/)); await wait(2500); freeze(w); },
      async (w) => { await toWonderHook(w); click(w, '[data-act="ob-wonder"]'); await until(() => w.Q.preview && w.Q.preview.ok); await wait(1400); click(w, '#btn-confirm'); await until(() => sheetHas(w, /Your name is on/), 16000); },
      async (w) => { await toWonderHook(w); click(w, '[data-act="ob-skip"]'); await until(() => w.document.querySelector('#nation-list')); },
    ],
    // After the first visit.
    5: [
      async (w) => { await onboard(w); click(w, '#btn-daily'); await wait(600); },
      async (w) => { await onboard(w); w.Q.acts.book(); await wait(600); },
      async (w) => { await onboard(w); const s = w.Q.server, r = s.meRow(); r.xp = 1200; r.buttons = 500; s.write(); await w.Q.refreshMe(); w.Q.acts.shop(); await wait(600); },
    ],
    6: [
      async (w) => { await onboard(w); const s = w.Q.server, r = s.meRow(); r.xp = 1200; s.write(); await w.Q.refreshMe(); w.Q.emit('founding-sheet', w.Q.world.wonders.find((x) => x.status === 'founding')); await wait(600); },
      async (w) => { await onboard(w); const h = w.Q.R.homeRect(w.Q.world, w.Q.me); w.Q.flyTo(h.x + 4, h.y + 3, 18, { ms: 40 }); await wait(1500); },
      async (w) => { await onboard(w); const t = w.Q.world.wonders[0]; w.Q.flyTo(t.x + 7, t.y + 8, 22, { ms: 40 }); await wait(1500); },
    ],
    // The neighborhood: a full Block, a neighbor's home up close, and the whole quilt.
    8: [
      async (w) => { await onboard(w); w.Q.flyTo(32, 32, 14, { ms: 40 }); await wait(1500); },
      async (w) => { await onboard(w); const p = w.Q.world.players.get('demo-7'); const h = w.Q.R.homeRect(w.Q.world, p); w.Q.flyTo(h.x + 4, h.y + 4, 36, { ms: 40 }); await wait(1500); },
      async (w) => { await onboard(w); w.Q.flyTo(w.Q.world.W / 2, w.Q.world.H / 2, 5, { ms: 40 }); await wait(1500); },
    ],
    // Quilt fabrics: choosing one in your profile, the shop's fabrics, and a home in Starry Night.
    9: [
      async (w) => { await onboard(w); const s = w.Q.server, r = s.meRow(); r.xp = 1200; r.buttons = 500; s.write(); await w.Q.refreshMe(); w.Q.acts.you(); await wait(600); const el = w.document.querySelector('#sheet .swatches'); el.scrollIntoView({ block: 'center' }); await wait(300); },
      async (w) => { await onboard(w); const s = w.Q.server, r = s.meRow(); r.xp = 1200; r.buttons = 500; s.write(); await w.Q.refreshMe(); w.Q.acts.shop(); await wait(600); const el = w.document.querySelector('[data-act="buy"][data-id="cherry"]'); el.scrollIntoView({ block: 'center' }); await wait(300); },
      async (w) => { await onboard(w); const s = w.Q.server, r = s.meRow(); r.xp = 1200; r.buttons = 500; r.fabrics = ['starry']; r.fabric = 'starry'; s.write(); await w.Q.refreshMe(); w.Q.renderer.markAllDirty(); const h = w.Q.R.homeRect(w.Q.world, w.Q.me); w.Q.flyTo(h.x + 4, h.y + 4, 30, { ms: 40 }); await wait(1500); },
    ],
    // Visiting: the wish for a path to a neighbor, Stitchlings out visiting along the lanes, and the card.
    10: [
      async (w) => { await onboard(w); const h = w.Q.R.homeRect(w.Q.world, w.Q.me); w.Q.startPlacing('park', { noFly: true }); w.Q.setPreview(h.x + 4, h.y + 3); w.Q.confirmPlacement(); w.Q.stopPlacing(); w.Q.flyTo(h.x + 3.5, h.y + 4, 44, { ms: 40 }); await wait(1500); freeze(w); },
      async (w) => { await onboard(w); w.Q.flyTo(20, 44, 20, { ms: 40 }); await wait(1200); simulate(w, 40); freeze(w); },
      async (w) => { await onboard(w); const h = w.Q.R.homeRect(w.Q.world, w.Q.me); w.Q.flyTo(h.x + 3.5, h.y + 4.5, 44, { ms: 40 }); await wait(1200); const a = w.Q.renderer.residentsOf(h.x + 3, h.y + 5)[0]; if (a) w.Q.emit('critter', a); await wait(1200); freeze(w); },
    ],
    // Welcome back: coming back nine hours later to stickers, a watered garden and a growing Wonder.
    11: [
      async (w) => { await comeBack(w); },
      async (w) => { await comeBack(w); const s = w.document.querySelector('#sheet [data-close]'); s.scrollIntoView({ block: 'end' }); await wait(300); },
      async (w) => { await comeBack(w, true); },
    ],
    // The Quiltopia Club: the page, the demo's pretend checkout, and a member's home in this month's fabric.
    12: [
      async (w) => { await levelUp(w, 8); w.Q.acts.club(); await wait(600); },
      async (w) => { await levelUp(w, 8); w.Q.acts.club(); await wait(400); w.Q.acts['club-join'](); await wait(600); },
      async (w) => {
        await levelUp(w, 8);
        await w.Q.call('joinClub');
        const f = w.Q.R.clubFabricFor(Date.now());
        await w.Q.call('equip', { fabric: f });
        // A neighbor joined too, so the star shows on a name label.
        const s = w.Q.server, n = s.data.players.find((p) => p.demo && p.homeBlock === 2);
        n.clubUntil = Date.now() + 864e5 * 20; s.write(); s.pull();
        w.Q.renderer.markAllDirty();
        const h = w.Q.R.homeRect(w.Q.world, w.Q.me);
        w.Q.flyTo(h.x + 4, h.y - 1, 24, { ms: 40 });
        await wait(1500);
      },
    ],
    // The Wonder finale: the show as your last stitch finishes it, the plaque, and the picture to share.
    13: [
      async (w) => { const at = watchShow(w); await finishWonder(w); await until(() => at.start, 20000); simulate(w, 1.15, at.start); freeze(w, at.start + 1.15); },
      async (w) => { const at = watchShow(w); await finishWonder(w); await until(() => at.debut, 20000); await wait(1600); simulate(w, 1.1, at.debut); freeze(w, at.debut + 1.1); },
      async (w) => { await finishWonder(w); await until(() => sheetHas(w, /stitched by/i) && w.document.getElementById('postcard').naturalWidth > 100, 25000); await wait(300); freeze(w); },
    ],
    // The postcard itself, the plaque's buttons, and the show at night.
    14: [
      async (w) => {
        await finishWonder(w);
        const img = await until(() => sheetHas(w, /stitched by/i) && w.document.getElementById('postcard').naturalWidth > 100 && w.document.getElementById('postcard'), 25000);
        w.document.body.insertAdjacentHTML('beforeend', `<div style="position:fixed;inset:0;z-index:99;background:#555;display:grid;place-items:center"><img src="${img.src}" style="width:100%"></div>`);
        await wait(300); freeze(w);
      },
      async (w) => { await finishWonder(w); await until(() => sheetHas(w, /stitched by/i) && w.document.getElementById('postcard').naturalWidth > 100, 25000); w.document.querySelector('#sheet [data-act="copy-wonder"]').scrollIntoView({ block: 'end' }); await wait(300); freeze(w); },
      async (w) => { const at = watchShow(w); w.Q.prefs.night = 'night'; await finishWonder(w); await until(() => at.debut, 20000); await wait(1600); simulate(w, 1.1, at.debut); freeze(w, at.debut + 1.1); },
    ],
    // The rare first visit whose very first Wonder slot is its last: the show, the plaque, then the visit carries on.
    15: [
      async (w) => { const at = watchShow(w); await firstSlotFinishes(w); await until(() => at.debut, 20000); await wait(1600); simulate(w, 1.1, at.debut); freeze(w, at.debut + 1.1); },
      async (w) => { await firstSlotFinishes(w); await until(() => sheetHas(w, /Stitched by/) && w.document.getElementById('postcard').naturalWidth > 100, 25000); await wait(300); freeze(w); },
      async (w) => { await firstSlotFinishes(w); await until(() => sheetHas(w, /Stitched by/), 25000); w.document.querySelector('#sheet [data-close]').click(); await until(() => w.document.querySelector('#nation-list'), 4000); await wait(300); freeze(w); },
    ],
    // Up next: the plaque's next Wonder, then every Wonder finished and the town proposing another.
    16: [
      async (w) => { await finishWonder(w); await until(() => sheetHas(w, /Stitched by/) && w.document.getElementById('postcard').naturalWidth > 100, 25000); w.document.querySelector('#sheet .up-next').scrollIntoView({ block: 'center' }); await wait(300); freeze(w); },
      async (w) => { await finishAll(w); const p = w.Q.world.wonders.find((x) => x.status === 'founding'); const bp = w.Q.R.BLUEPRINTS[p.blueprint]; w.Q.flyTo(p.x + bp.rows[0].length / 2, p.y + bp.rows.length / 2, 16, { ms: 40 }); await wait(1500); freeze(w); },
      async (w) => { await finishAll(w); w.Q.helpBuild(null); await until(() => sheetHas(w, /Proposed by the town/), 4000); await wait(400); freeze(w); },
    ],
    // Daily goals: the panel with a Go button on each, a goal done rising from the dock, and all three done.
    17: [
      async (w) => { await onboard(w); await w.Q.showDaily(); await wait(600); },
      async (w) => { await onboard(w); const g = (await todaysGoals(w)).find((x) => !x.done); finishGoal(w, g.id); await until(() => !w.document.getElementById('goal-card').hidden, 6000); await wait(500); freeze(w); },
      async (w) => { await onboard(w); for (const g of (await todaysGoals(w)).filter((x) => !x.done)) finishGoal(w, g.id); await until(() => w.document.getElementById('goal-card').classList.contains('all'), 15000); await wait(400); freeze(w); },
    ],
    // Rare Stitchlings: the Stitchbook's rare page, Go find it, and building a Firefly's spot at home.
    18: [
      async (w) => { await onboard(w); w.Q.acts['book-page']({ dataset: { page: 'rare' } }); await wait(600); },
      async (w) => {
        await onboard(w);
        w.Q.acts['book-page']({ dataset: { page: 'rare' } });
        await wait(400);
        const b = w.document.querySelector('[data-act="rare-go"]');
        if (b) b.click();
        await wait(2200); simulate(w, 0.5); w.Q.lookForRare(); simulate(w, 1); freeze(w);
      },
      async (w) => {
        await onboard(w);
        const Q = w.Q, s = Q.server, R = Q.R, me = s.meRow(), h = R.homeRect(s.world, me);
        me.items.lantern = 1; s.write(); await Q.refreshMe();
        s.insert(h.x, h.y + 1, 'water', me.id, R.zoneOf(s.world, h.x, h.y + 1));
        s.insert(h.x + 1, h.y, 'tree', me.id, R.zoneOf(s.world, h.x + 1, h.y));
        s.write();
        Q.flyTo(h.x + 2, h.y + 2, 44, { ms: 40 });
        await wait(1200);
        Q.startPlacing('lantern', { noFly: true });
        Q.setPreview(h.x + 1, h.y + 1);
        Q.confirmPlacement();
        await wait(900); simulate(w, 1); freeze(w);
      },
    ],
    // Wishes: a bubble over your Stitchling and a marked patch in the tray, then the wish coming true.
    7: [
      async (w) => { await onboard(w); const h = w.Q.R.homeRect(w.Q.world, w.Q.me); w.Q.flyTo(h.x + 3.5, h.y + 4.5, 56, { ms: 40 }); await wait(1500); freeze(w); },
      async (w) => { await onboard(w); const h = w.Q.R.homeRect(w.Q.world, w.Q.me); w.Q.flyTo(h.x + 3.5, h.y + 4.5, 56, { ms: 40 }); await wait(1200); w.Q.startPlacing('park', { noFly: true }); w.Q.setPreview(h.x + 4, h.y + 3); w.Q.confirmPlacement(); await wait(900); freeze(w); },
      async (w) => { await onboard(w); const h = w.Q.R.homeRect(w.Q.world, w.Q.me); w.Q.flyTo(h.x + 3.5, h.y + 4.5, 36, { ms: 40 }); await wait(1200); w.Q.startPlacing('park', { noFly: true }); w.Q.setPreview(h.x + 4, h.y + 3); w.Q.confirmPlacement(); w.Q.stopPlacing(); await wait(2500); freeze(w); },
    ],
  };

  const fresh = { 13: true, 14: true, 15: true, 16: true };

  (async () => {
    Object.keys(localStorage).filter((k) => k.startsWith('quiltopia')).forEach((k) => localStorage.removeItem(k));
    const set = new URLSearchParams(location.search).get('set') || '1';
    const night = new URLSearchParams(location.search).get('night');
    let i = 0;
    for (const step of sets[set]) {
      // Sets that finish things start each frame in a world of its own.
      if (fresh[set]) Object.keys(localStorage).filter((k) => k.startsWith('quiltopia:demo')).forEach((k) => localStorage.removeItem(k));
      const w = await frame('s' + set + '-' + (i++), { night: night ? 'night' : 'day' });
      try { await step(w); } catch (e) { w.document.body.insertAdjacentHTML('afterbegin', '<pre style="position:fixed;z-index:99;background:#fff;color:red">' + e.stack + '</pre>'); }
    }
    document.title = 'done';
  })();
</script>
